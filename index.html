<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batatiba | Restaurante</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- CABEÇALHO -->
    <header class="cabecalho">
        <div class="logo">
            <img src="img/logo_Batatibasemfundo.png" alt="Logo Batatiba">
        </div>
        <nav class="categoria">
            <a href="#cardapio">Cardápio</a>
            <a href="#promocoes">Promoções</a>
            <a href="#quem-somos">Quem Somos</a>
            <a href="#localizacao">Localização</a>
        </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
        <section class="container-destaque">
            <div class="cartao-destaque">
                
                <!-- Lado Esquerdo: Texto de Apresentação e Botão -->
                <div class="coluna-texto">
                    <h1>O sabor que te conquista a cada batata.</h1>
                    <p>Descubra o Batatiba: as torres de batata mais generosas da cidade, porções de dar água na boca e o melhor lugar para reunir os amigos.</p>
                    <a href="#cardapio" class="botao-acao">VER CARDÁPIO COMPLETO</a>
                </div>

                <!-- Lado Direito: Imagem Enquadrada -->
                <div class="coluna-imagem">
                    <img src="img/Batata.png" alt="Torre de Batata e porções do Batatiba">
                </div>

            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
